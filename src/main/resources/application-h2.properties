# H2 In-Memory Profile for seamless local development
spring.datasource.url=jdbc:h2:mem:internship_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway migrations target Postgres syntax; let Hibernate manage the throwaway H2 schema instead.
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
