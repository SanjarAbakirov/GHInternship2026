# ===================================================================
# Профиль разработки (dev): локальная СУБД PostgreSQL
# Активация: --spring.profiles.active=dev или -Dspring-boot.run.profiles=dev
# ===================================================================

# Параметры подключения к локальной PostgreSQL (порт 5432, БД gh_internship_db)
# JDBC URL строго следует спецификации: jdbc:postgresql://<host>:<port>/<database>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gh_internship_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:gh_app_user}
spring.datasource.password=${DB_PASSWORD:YOUR_DEV_DB_PASSWORD_HERE}

# Режим управления схемой Hibernate для разработки:
# 'update' безопасно обновляет схему, добавляя новые таблицы и колонки без удаления существующих данных
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Логирование и форматирование SQL-запросов для удобной отладки в среде разработки
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# H2 Console строго отключена для профиля PostgreSQL
spring.h2.console.enabled=false

