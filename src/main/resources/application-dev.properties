# Local / development profile — PostgreSQL datasource
# Activate with: spring.profiles.default=dev (default) or --spring.profiles.active=dev
# Credentials via env vars or application-local.properties (never commit real passwords)

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:internship_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:internship_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is now owned by Flyway migrations (db/migration); Hibernate only validates it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Baseline existing databases (created earlier via ddl-auto=update) at V1 so Flyway
# doesn't try to re-create tables that already exist. Fresh databases just run V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
