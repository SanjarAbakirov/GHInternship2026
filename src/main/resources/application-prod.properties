# ===================================================================
# Профиль продакшена (prod): безопасное подключение к PostgreSQL
# Активация: --spring.profiles.active=prod
# ===================================================================

# Обязательные параметры подключения из переменных окружения
# JDBC URL строго следует спецификации: jdbc:postgresql://<host>:<port>/<database>
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Безопасный режим управления схемой для продакшена:
# 'validate' только проверяет соответствие таблиц и колонок сущностям JPA,
# предотвращая случайное удаление или неконтролируемую мутацию схемы (fail-fast)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Отключение отображения сырых SQL-запросов в логах продакшена в целях безопасности
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console строго отключена в production
spring.h2.console.enabled=false
