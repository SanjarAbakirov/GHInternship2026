# Production profile — PostgreSQL datasource with safer schema management
# Activate with: --spring.profiles.active=prod  or  SPRING_PROFILES_ACTIVE=prod
# Require explicit env vars (no insecure defaults for password)

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate: do not change schema at runtime; use migrations in real deployments
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
