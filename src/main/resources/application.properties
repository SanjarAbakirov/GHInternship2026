# Настройка базы данных H2 (для разработки и тестирования)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Автоматическое создание таблиц
spring.jpa.hibernate.ddl-auto=update

# Показывать SQL запросы в консоли
spring.jpa.show-sql=true

# Консоль H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Порт сервера
server.port=8080

#openai.api.key=${OPENAI_API_KEY:your-demo-key}
#openai.api.url=https://api.openai.com/v1/chat/completions

#openai.api.key=${OPENAI_API_KEY}
openai.api.key=your-test-key-here
openai.api.url=https://api.openai.com/v1/chat/completions

# JWT Configuration
jwt.secret=my_super_secret_key_that_must_be_at_least_256_bits_long_for_hs256
