spring.application.name=GHInternship2026

# ==========================================
# H2 In-Memory Database Configuration
# ==========================================
# In-memory DB — data is lost on every restart (ephemeral)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: creates schema on startup, drops it on shutdown (ephemeral)
spring.jpa.hibernate.ddl-auto=create-drop
# Show SQL queries in console (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==========================================
# Spring Security (dev credentials)
# ==========================================
spring.security.user.name=admin
spring.security.user.password=admin
