# Database H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# AI Service
openai.api.key=${OPENAI_API_KEY:your_local_key_here}
openai.api.url=${OPENAI_API_URL:https://api.deepseek.com/v1/chat/completions}
openai.api.model=${OPENAI_API_MODEL:deepseek-chat}

# JWT — loaded from env
jwt.secret=${JWT_SECRET:your_local_jwt_secret}

openai.api.url=https://api.deepseek.com/v1/chat/completions
openai.api.key=sk-ваш_реальный_ключ_deepseek
jwt.secret=my_super_secret_key_that_must_be_at_least_256_bits_long_for_hs256