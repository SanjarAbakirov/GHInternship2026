# Default profile is h2 for instant local runs without Docker dependency.
# For PostgreSQL mode with Docker, active dev profile with: -Dspring-boot.run.profiles=dev
spring.profiles.default=h2

# Server
server.port=8080

# Optional local overrides (gitignored) — passwords, JWT, API keys
spring.config.import=optional:classpath:application-local.properties

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.api.model=${OPENAI_API_MODEL:gpt-3.5-turbo}

jwt.secret=${JWT_SECRET:}
