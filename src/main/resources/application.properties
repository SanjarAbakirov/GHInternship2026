# Shared application settings (no DB secrets here).
# Local/dev Postgres config: application-dev.properties
# Production-safe schema checks: application-prod.properties
spring.profiles.default=dev

# Server
server.port=8080

# Optional local overrides (gitignored) — passwords, JWT, API keys
spring.config.import=optional:classpath:application-local.properties

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.api.model=${OPENAI_API_MODEL:gpt-3.5-turbo}

jwt.secret=${JWT_SECRET:}
