# Default profile is dev (PostgreSQL).
# For local H2 mode without PostgreSQL, activate with: -Dspring-boot.run.profiles=h2
spring.profiles.default=dev

# Server
server.port=8080

# Optional local overrides (gitignored) — passwords, JWT, API keys
spring.config.import=optional:classpath:application-local.properties

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://openrouter.ai/api/v1/chat/completions}
openai.api.model=${OPENAI_API_MODEL:deepseek/deepseek-r1:free}

jwt.secret=${JWT_SECRET:}
